name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: npm run prepare:assets
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run tauri -- build --target x86_64-pc-windows-msvc
      - name: Verify packaged installer on isolated Windows runner
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force artifacts/windows | Out-Null
          Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/帧印_${version}_x64-setup.exe" artifacts/windows/
          if (-not (Get-Command llvm-readobj.exe -ErrorAction SilentlyContinue)) {
            $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
          }
          npm run verify:windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows/*setup.exe
          if-no-files-found: error
